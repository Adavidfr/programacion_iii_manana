<!doctype html>
<html lang="es">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Contacto - MobileTech</title>
</head>
<body>
<header>
    <h1>Contáctanos</h1>
    <nav>
        <a href="index.html">Inicio</a> |
        <a href="acerca.html">Acerca de</a> |
        <a href="servicios.html">Servicios</a> |
        <a href="tabla.html">Modelos</a> |
        <a href="contacto.html">Contacto</a>
    </nav>
    <hr>
</header>

<main>
    <section>
        <h2>Formulario de contacto</h2>
        <form action="#" method="post">
            <fieldset>
                <legend>Datos personales</legend>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required><br><br>

                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" required><br><br>

                <label for="telefono">Teléfono:</label>
                <input type="number" id="telefono" name="telefono"><br><br>

                <label for="fecha">Fecha de consulta:</label>
                <input type="date" id="fecha" name="fecha"><br><br>

                <label for="tipo">Motivo:</label>
                <select id="tipo" name="tipo">
                    <option value="compra">Compra</option>
                    <option value="soporte">Soporte</option>
                    <option value="otro">Otro</option>
                </select><br><br>

                <label>¿Deseas recibir promociones?</label>
                <input type="radio" id="si" name="promos" value="si">
                <label for="si">Sí</label>
                <input type="radio" id="no" name="promos" value="no">
                <label for="no">No</label><br><br>

                <label for="mensaje">Mensaje:</label><br>
                <textarea id="mensaje" name="mensaje" rows="4" cols="40"></textarea><br><br>

                <button type="submit">Enviar</button>
            </fieldset>
        </form>
    </section>

    <aside>
        <p>También puedes escribirnos a <a href="mailto:info@mobiletech.ec">info@mobiletech.ec</a></p>
    </aside>
</main>

<footer>
    <hr>
    <address>MobileTech | Quito - Ecuador</address>
</footer>
</body>
</html>
