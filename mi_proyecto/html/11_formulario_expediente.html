<!DOCTYPE html>
<html lang="es">
<head> 
  <meta charset="UTF-8">
  <title>Registro de Cliente - Venta de Móviles</title>
</head>
<body>  
    <h1>Formulario de Registro de Cliente</h1>
    <form action="procesar.php" method="post">
        <table border="0">
            <tr>
                <th>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre">
                </th>
                <th>
                    <label for="correo">Correo Electrónico:</label>
                    <input type="email" id="correo" name="correo">
                </th>
            </tr>
            <tr>
                <th>
                    <label for="fecha">Fecha de Nacimiento:</label>
                    <input type="date" id="fecha" name="fecha">
                </th>
                <th>
                    <label for="color">Color de celular favorito:</label>
                    <input type="color" id="color" name="color">
                </th>
            </tr>
            <tr>
                <td>
                    <label for="genero">Género:</label>
                    <input type="radio" id="m" name="genero"><label for="m">Masculino</label>
                    <input type="radio" id="f" name="genero"><label for="f">Femenino</label>
                </td>
                <td>
                    <label for="pais">País:</label>
                    <select id="pais" name="pais">
                        <option value="ec">Ecuador</option>
                        <option value="co">Colombia</option>
                        <option value="pe">Perú</option>
                        <option value="ve">Venezuela</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="comentarios">Comentarios:</label>
                    <textarea id="comentarios" name="comentarios" rows="5" placeholder="Escriba sus preferencias o consultas"></textarea>
                </td>
                <td>
                    <input type="checkbox" id="acepto" name="acepto" required>
                    <label for="acepto">Acepto los términos y condiciones de la tienda</label>
                </td>
            </tr>
        </table>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpiar">
    </form>
</body>
</html>
